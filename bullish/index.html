<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What makes a good brand campaign?</title>
<base href="https://thomasjsx.github.io/convai-widget/bullish/">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Thomas Stevenson for Bullish, CoinDesk and Consensus.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage"></div>

  <nav id="chapters" aria-label="Chapters"></nav>
  <div id="chips" hidden></div>
  <div id="captions" aria-live="polite"></div>
  <div id="controls">
    <button id="pause" aria-label="Pause">❚❚</button>
    <p id="mic" hidden aria-live="polite"><i></i><span></span></p>
  </div>
  <button id="talk" data-state="idle" aria-label="Ask a question"><i></i><span>Ask a question</span></button>
  <div id="progress"></div>

  <div id="start">
    <h1>What makes a good brand campaign?</h1>
    <p>For Bullish, CoinDesk and Consensus</p>
    <button id="play">▶ Start · sound on</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
